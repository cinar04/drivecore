name: Zamanlı Belge Süre Kontrolü

# Her gün 06:00 UTC (TR saatiyle 09:00) çalışır — ehliyet gibi sürücü ve
# trafik sigortası/muayene gibi araç belgelerinin son geçerlilik tarihine
# 7, 3, 2 veya 1 gün kala kurumun
# "Uyarı Alacak Kişiler" listesindeki üyelere e-posta + uygulama içi/native
# bildirim gönderir. Ayrıca "workflow_dispatch" ile GitHub Actions
# sekmesinden elle de tetiklenebilir.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-document-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: firebase-admin kur
        run: npm install firebase-admin --no-save

      - name: Zamanlı belgeleri kontrol et ve uyarıları kuyruğa al
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APP_DRIVER_BASE_URL: ${{ secrets.APP_DRIVER_BASE_URL }}
          APP_VEHICLE_BASE_URL: ${{ secrets.APP_VEHICLE_BASE_URL }}
        run: node scripts/check-document-expiry.mjs

      # Bu mailler tarayıcıdan değil, doğrudan bu workflow tarafından sunucu
      # tarafında kuyruğa alındığı için src/lib/mailOutbox.ts'deki anlık
      # tetikleme (repository_dispatch) burada devreye girmez. Bu yüzden
      # gönderim scriptini aynı job içinde art arda çalıştırıyoruz.
      - name: Kuyruğa alınan uyarı e-postalarını gönder
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          APP_RESET_PASSWORD_URL: ${{ secrets.APP_RESET_PASSWORD_URL }}
          APP_LOGO_URL: ${{ secrets.APP_LOGO_URL }}
        run: node scripts/send-mail-outbox.mjs
